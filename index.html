<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icono-192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#764ba2">
    <link rel="apple-touch-icon" href="./icono-192.png">
    <title>Conversor de Monedas</title>
</head>
<body>

    <div class="card">
  <h2>Conversor de Monedas</h2>
  
  <div class="input-group">
    <input type="number" id="monto" value="1" min="0" placeholder="0.00" />
  </div>

  <div class="row">
    <select id="moneda-origen">
      <option value="USD">🇺🇸 USD</option>
      <option value="EUR">🇪🇺 EUR</option>
      <option value="VES">🇻🇪 VES</option>
    </select>
    
    <img src="flecha-amigable.png" alt="flecha de conversión amistosa" class="icon" onclick="intercambiarMonedas()">
    
    <select id="moneda-destino">
      <option value="EUR">🇪🇺 EUR</option>
      <option value="USD">🇺🇸 USD</option>
      <option value="VES">🇻🇪 VES</option>
    </select>
  </div>

  <button onclick="convertirMoneda()">Convertir</button>
  
  <div id="resultado" class="resultado">---</div>
</div>
    
</body>
<script src="script.js"></script>
<script>
    // Verifica si el navegador soporta Service Workers
    if ('serviceWorker' in navigator) {
      // Cuando la página termine de cargar, registra el archivo sw.js
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registro => {
            console.log('¡Service Worker activado con éxito!', registro.scope);
          })
          .catch(error => {
            console.error('Falló el registro del Service Worker:', error);
          });
      });
    }
</script>
</html>
